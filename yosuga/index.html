<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yosuga — 保存を「未来の自分との約束」に変えるアプリ</title>
<meta name="description" content="Yosugaは、保存を「未来の自分との約束」に変え、その約束を守れるかたちにして返すiOSアプリ。">
<meta name="theme-color" content="#2f6b4f">
<link rel="icon" type="image/svg+xml" href="assets/logo.svg">
<link rel="apple-touch-icon" href="assets/logo.svg">
<meta property="og:type" content="website">
<meta property="og:title" content="Yosuga — 保存を「未来の自分との約束」に変えるアプリ">
<meta property="og:description" content="保存を「未来の自分との約束」に変え、その約束を守れるかたちにして返すiOSアプリ。">
<meta property="og:url" content="https://rinro.jp/yosuga/">
<meta property="og:locale" content="ja_JP">
<meta property="og:image" content="https://rinro.jp/yosuga/assets/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Yosuga — 保存を「未来の自分との約束」に変える">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Yosuga — 保存を「未来の自分との約束」に変えるアプリ">
<meta name="twitter:description" content="保存を「未来の自分との約束」に変え、その約束を守れるかたちにして返すiOSアプリ。">
<meta name="twitter:image" content="https://rinro.jp/yosuga/assets/og-image.png">
<style>
  :root{
    color-scheme: dark;
    --ff:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Helvetica Neue",Arial,sans-serif;
    --green:#2f6b4f; --green2:#3f7d52; --greenD:#234f3a;
    --orange:#e08a2b; --purple:#7c66d8; --purpleTx:#6b56c8;
    --ink:#21261f; --sub:#6b7464; --line:rgba(40,60,40,.10);
    --bg:#f6f7f3; --card:#ffffff; --hero:#f1f3ee;
    --phoneBg:#15171a; --screen:#f1f3ee; --screenTx:#21261f; --pcard:#fff; --pline:#edf0e9; --psub:#8a9582;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;}
  html{scroll-behavior:smooth;}
  body{font-family:var(--ff);background:var(--bg);color:var(--ink);line-height:1.75;}
  a{color:var(--green);text-decoration:none;}
  a:hover{text-decoration:underline;}
  .wrap{max-width:1080px;margin:0 auto;padding:0 22px;}
  .eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--green2);}

  /* ===== top bar ===== */
  header.bar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--line);}
  .bar .wrap{display:flex;align-items:center;justify-content:space-between;height:58px;}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;color:var(--ink);}
  .brand .logo{width:28px;height:28px;border-radius:8px;object-fit:cover;display:block;}
  .bar nav{display:flex;align-items:center;gap:22px;font-size:14px;}
  .bar nav a{color:var(--sub);}
  .bar nav .cta{background:var(--green);color:#fff;padding:8px 15px;border-radius:999px;font-weight:700;}
  .bar nav .cta:hover{text-decoration:none;background:var(--greenD);}
  @media(max-width:640px){.bar nav a.lnk{display:none;}}

  /* ===== hero ===== */
  .hero{background:linear-gradient(180deg,var(--hero),var(--bg));padding:70px 0 40px;}
  .hero .wrap{display:grid;grid-template-columns:1fr minmax(280px,340px);gap:46px;align-items:center;}
  .hero h1{font-size:clamp(30px,5vw,46px);line-height:1.18;font-weight:800;letter-spacing:.01em;margin:14px 0 16px;}
  .hero h1 .accent{color:var(--green);}
  .hero p.lead{font-size:17px;color:var(--sub);max-width:30em;}
  .hero .actions{display:flex;flex-wrap:wrap;gap:13px;margin-top:26px;align-items:center;}
  .btn{display:inline-flex;align-items:center;gap:9px;font-weight:700;border-radius:999px;padding:13px 22px;font-size:15px;}
  .btn.primary{background:var(--green);color:#fff;}
  .btn.primary:hover{background:var(--greenD);text-decoration:none;}
  .btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);}
  .btn.ghost:hover{text-decoration:none;border-color:var(--green);}
  .hero .note{font-size:13px;color:var(--sub);margin-top:14px;}
  .hero .shot{display:flex;justify-content:center;}
  @media(max-width:840px){.hero .wrap{grid-template-columns:1fr;text-align:center;}
    .hero p.lead{margin-left:auto;margin-right:auto;} .hero .actions{justify-content:center;} .hero .shot{margin-top:8px;}}

  /* ===== section ===== */
  section{padding:62px 0;}
  .section-head{text-align:center;max-width:42em;margin:0 auto 8px;}
  .section-head h2{font-size:clamp(24px,3.4vw,32px);font-weight:800;line-height:1.3;margin:10px 0 12px;}
  .section-head p{color:var(--sub);font-size:16px;}

  /* feature rows */
  .feature{display:grid;grid-template-columns:1fr minmax(280px,330px);gap:52px;align-items:center;padding:46px 0;border-top:1px solid var(--line);}
  .feature:nth-child(even){grid-template-columns:minmax(280px,330px) 1fr;}
  .feature:nth-child(even) .ftxt{order:2;}
  .feature .shot{display:flex;justify-content:center;}
  .feature h3{font-size:25px;font-weight:800;margin:10px 0 12px;}
  .feature p{color:var(--sub);font-size:16px;}
  .feature ul{list-style:none;margin:18px 0 0;display:flex;flex-direction:column;gap:11px;}
  .feature ul li{position:relative;padding-left:28px;color:var(--ink);font-size:15px;}
  .feature ul li::before{content:"";position:absolute;left:0;top:9px;width:15px;height:9px;border-left:2.4px solid var(--green);border-bottom:2.4px solid var(--green);transform:rotate(-45deg);}
  .pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;letter-spacing:.04em;padding:4px 11px;border-radius:999px;background:rgba(124,102,216,.14);color:var(--purpleTx);}
  @media(max-width:840px){
    .feature,.feature:nth-child(even){grid-template-columns:1fr;text-align:center;gap:26px;}
    .feature:nth-child(even) .ftxt{order:0;}
    .feature ul{align-items:flex-start;display:inline-flex;text-align:left;margin-inline:auto;}
  }

  /* how-to flow */
  .flow{background:var(--hero);}
  .steps{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:34px;}
  .step{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px 22px;}
  .step .k{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:11px;font-weight:800;font-size:17px;color:#fff;}
  .step.am .k{background:var(--orange);} .step.mid .k{background:var(--green);} .step.pm .k{background:var(--purple);}
  .step h4{font-size:18px;font-weight:800;margin:15px 0 8px;}
  .step p{color:var(--sub);font-size:14.5px;}
  .step .tag{font-size:12px;font-weight:700;color:var(--sub);letter-spacing:.05em;}
  @media(max-width:760px){.steps{grid-template-columns:1fr;}}

  /* mini features grid */
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:34px;}
  .mini{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px 22px;}
  .mini .ic{font-size:24px;}
  .mini h4{font-size:17px;font-weight:800;margin:12px 0 7px;}
  .mini p{color:var(--sub);font-size:14.5px;}
  @media(max-width:760px){.grid3{grid-template-columns:1fr;}}

  /* pricing */
  .price{background:var(--hero);}
  .ptable{max-width:680px;margin:34px auto 0;background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;}
  .ptable .prow{display:grid;grid-template-columns:1fr 92px 120px;align-items:center;padding:15px 22px;border-top:1px solid var(--line);font-size:15px;}
  .ptable .phead{border-top:none;font-weight:800;background:rgba(47,107,79,.07);}
  .ptable .prow .col{text-align:center;font-weight:700;}
  .ptable .prow .feat{color:var(--ink);}
  .ptable .prow .pro{color:var(--green);}
  .ptable .mark-no{color:var(--sub);}
  .ptable .phead .pro{color:var(--green);}
  .priceline{text-align:center;margin-top:22px;color:var(--sub);font-size:15px;}
  .priceline b{color:var(--ink);font-size:17px;}

  /* final cta */
  .final{text-align:center;}
  .final .box{background:linear-gradient(150deg,var(--green2),var(--greenD));color:#fff;border-radius:26px;padding:54px 28px;}
  .final h2{font-size:clamp(24px,3.4vw,32px);font-weight:800;margin-bottom:12px;}
  .final p{opacity:.92;max-width:34em;margin:0 auto 26px;font-size:16px;}
  .final .btn.white{background:#fff;color:var(--greenD);}
  .final .btn.white:hover{text-decoration:none;background:#f0efe9;}

  /* footer */
  footer.site{padding:46px 0 60px;border-top:1px solid var(--line);}
  footer.site .wrap{display:flex;flex-wrap:wrap;gap:20px;justify-content:space-between;align-items:center;}
  footer.site .links{display:flex;flex-wrap:wrap;gap:8px 20px;font-size:14px;}
  footer.site .links a{color:var(--sub);}
  footer.site .copy{font-size:13px;color:var(--sub);}

  /* ================= device frame (実機スクリーンショット) ================= */
  .device{width:290px;max-width:80vw;padding:9px;background:#15171a;border-radius:46px;box-shadow:0 22px 50px rgba(0,0,0,.22);flex:none;}
  .device img{display:block;width:100%;height:auto;border-radius:38px;}

  .visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);}
</style>
</head>
<body>

<header class="bar">
  <div class="wrap">
    <a class="brand" href="#top"><img class="logo" src="assets/logo.svg" width="28" height="28" alt="">Yosuga</a>
    <nav>
      <a class="lnk" href="#features">機能</a>
      <a class="lnk" href="#howto">使い方</a>
      <a class="lnk" href="#price">料金</a>
    </nav>
  </div>
</header>

<footer class="site">
  <div class="wrap">
    <div class="links">
      <a href="legal/privacy-policy/">プライバシーポリシー</a>
      <a href="legal/terms-of-service/">利用規約</a>
      <a href="legal/contact/">お問い合わせ</a>
      <a href="mailto:support@rinro.jp">support@rinro.jp</a>
    </div>
    <div class="copy">© Yosuga Developer</div>
  </div>
</footer>

</body>
</html>
